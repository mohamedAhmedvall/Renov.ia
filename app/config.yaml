# Configuration centralisée — mohamed_casses
# Tous les paramètres métier, chemins et seuils sont définis ici.
# Aucune valeur en dur dans le code Python.

# --- Chemins fichiers données ---
data_paths:
  scoring: "../V9/output/v9_scoring_fuites.csv"
  referentiel: "../data/canalisation_sem_3_1_.csv"
  shap_importance: "../V9/output/v9_shap_importance.csv"
  backtesting: "../V9/output/v9_backtesting.csv"
  geo_csv: "../data/geo.csv"
  geodata: "../data/troncons.gpkg"
  te_mappings:
    h1: "../V9/output/v9_te_mapping_h1.json"
    h3: "../V9/output/v9_te_mapping_h3.json"
    h5: "../V9/output/v9_te_mapping_h5.json"

# --- Mapping colonnes V9 → App ---
column_mapping:
  id_troncon: "OBJET"
  materiau: "MATERIAU"
  diametre: "DIAMETRE"
  famille_materiau: "famille_mat"
  age: "age"
  score_h1: "score_h1"
  score_h3: "score_h3"
  score_h5: "score_h5"
  rang: "rang"
  top_pct: "top_pct"

# --- Seuils de risque (quantiles, scores V9 calibrés en probabilités) ---
# critique = top 5% du score, eleve = 5-15%, modere = 15-30%, faible = reste
risk_quantiles:
  critique: 0.95
  eleve: 0.85
  modere: 0.70

# --- Seuils absolus (pour affichage graphique) ---
# Ces valeurs correspondent aux pourcentages de risque
risk_thresholds:
  critique: 0.70
  eleve: 0.40
  modere: 0.20

# --- Couleurs par classe de risque ---
risk_colors:
  critique: "#d32f2f"
  eleve: "#ff9800"
  modere: "#fdd835"
  faible: "#4caf50"

# --- Labels et emojis par classe ---
risk_labels:
  critique: "🔴 Critique"
  eleve: "🟠 Élevé"
  modere: "🟡 Modéré"
  faible: "🟢 Faible"

# --- Coûts de remplacement (€/ml) ---
couts_remplacement:
  urbain_dense: 450
  urbain_standard: 300
  rural: 180

# --- Matériaux de remplacement ---
materiaux_remplacement:
  fonte_ductile:
    cout_majorant: 1.0
    duree_vie_estimee: 80
  pehd:
    cout_majorant: 0.85
    duree_vie_estimee: 50

# --- Paramètres réseau ---
km_total_reseau: 100

# --- Traduction ML → métier ---
traduction_metier:
  SHAP: "Facteurs de risque"
  score: "Score de risque"
  feature: "Caractéristique"

# --- Horizon par défaut ---
default_horizon: 3

# --- Export ---
export:
  encoding: "utf-8"
  separator: ";"
