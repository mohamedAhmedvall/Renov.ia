services:
  # ── Backend FastAPI ──────────────────────────────────────────────────────────
  - type: web
    name: renovia-api
    runtime: python
    plan: free
    buildCommand: pip install .
    startCommand: uvicorn backend.app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      # Remplir avec l'URL du frontend après le premier déploiement
      # ex : https://renovia-frontend.onrender.com
      - key: ALLOWED_ORIGINS
        sync: false

  # ── Frontend React/Vite (site statique) ────────────────────────────────────
  - type: static
    name: renovia-frontend
    buildCommand: cd frontend && npm ci && npm run build
    staticPublishPath: ./frontend/dist
    envVars:
      # Remplir avec l'URL du backend après le premier déploiement
      # ex : https://renovia-api.onrender.com
      - key: VITE_API_URL
        sync: false
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
