# CI Renov.ia (démo) — lint + typage + tests (raccord §8.5 du mémoire).
# Trois gates bloquants : style (ruff/PEP 8), typage statique (mypy), tests (pytest).
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Installer les dépendances
        run: pip install -e ".[dev]"
      - name: Lint (ruff — PEP 8, imports, bugbear)
        run: ruff check .
      - name: Typage statique (mypy)
        run: mypy domain optimizer backend ml
      - name: Tests (pytest — unitaires, contrat, e2e)
        run: pytest -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Installer les dépendances
        run: npm ci || npm install
      - name: Lint (ESLint + a11y)
        run: npm run lint
      - name: Build (tsc + vite)
        run: npm run build
